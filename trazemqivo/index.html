<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0;url=https://allmyspicylink.com/trazemqivo">
<title>hey</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#16060B;color:#EFEAF4;overflow:hidden;
font:15px/1.55 Futura,"Avenir Next",-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;
padding:32px 26px calc(30px + env(safe-area-inset-bottom))}
.sky{display:block;position:fixed;left:-26%;right:-26%;bottom:-14%;height:98%;z-index:0;
background:radial-gradient(72% 82% at 42% 90%,rgba(224,69,95,.92),rgba(224,69,95,.44) 42%,rgba(224,69,95,0) 74%);
animation:rise 5s ease infinite alternate}
.sky i{position:absolute;left:0;right:0;bottom:4%;height:82%;display:block;
background:radial-gradient(44% 76% at 48% 90%,rgba(255,158,178,.72),rgba(255,158,178,0) 66%);
animation:slide 7s ease infinite alternate}
@keyframes rise{from{transform:translateY(13%) scaleY(.82);opacity:.52}
to{transform:translateY(-7%) scaleY(1.24);opacity:1}}
@keyframes slide{from{transform:translateX(-24vw) scaleX(.82)}to{transform:translateX(24vw) scaleX(1.22)}}
@media (prefers-reduced-motion:reduce){.sky,.sky i{animation:none}}
.box{position:relative;z-index:2;width:100%;max-width:340px;
border:1px solid rgba(239,234,244,.3);border-radius:4px;padding:30px 22px;
background:rgba(0,0,0,.24)}
.box p{margin:0 auto 24px;font-size:15px;line-height:1.55;color:rgba(239,234,244,.8)}
.tap{display:table;margin:0 auto;min-width:234px;border:0;border-radius:2px;
padding:18px 34px;font-size:15px;font-weight:600;white-space:nowrap;text-decoration:none;
color:#2A0810;background:#EFA6B4;-webkit-tap-highlight-color:transparent}
.tap:active{background:#D68C9A}
</style>
<script>location.replace("https://allmyspicylink.com/trazemqivo")</script>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i></div>
<main class="box">
<p>Opening…</p>
<a class="tap" href="https://allmyspicylink.com/trazemqivo">Tap if nothing happens</a>
</main>
</body>
</html>
