<title>hey</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0C0618;color:#EFEAF4;overflow:hidden;
font:15px/1.55 Futura,"Avenir Next",-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;
padding:30px 24px calc(30px + env(safe-area-inset-bottom))}
.glow{display:block;position:fixed;left:-30%;right:-30%;bottom:-17%;height:104%;z-index:0;
background:radial-gradient(66% 88% at 50% 86%,rgba(164,96,240,.92),rgba(164,96,240,.44) 42%,rgba(164,96,240,0) 74%);
animation:pulse 4.5s ease-in-out infinite alternate}
.glow b{position:absolute;left:0;right:0;bottom:2%;height:86%;display:block;
background:radial-gradient(46% 80% at 50% 92%,rgba(242,124,182,.72),rgba(242,124,182,0) 66%);
animation:drift 6.5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:translateY(15%) scaleY(.78);opacity:.48}
to{transform:translateY(-9%) scaleY(1.28);opacity:1}}
@keyframes drift{from{transform:translateX(-28vw) scaleX(.82)}to{transform:translateX(28vw) scaleX(1.22)}}
@media (prefers-reduced-motion:reduce){.glow,.glow b{animation:none}}
.card{position:relative;z-index:2;width:100%;max-width:348px;
border:1px solid rgba(239,234,244,.3);border-radius:8px;padding:30px 22px;
background:rgba(0,0,0,.24)}
.card p{margin:0 auto 26px;font-size:15px;line-height:1.55;color:rgba(239,234,244,.8)}
.go{display:table;margin:0 auto;min-width:234px;border:0;border-radius:6px;
padding:18px 34px;font-size:15px;font-weight:600;white-space:nowrap;text-decoration:none;
color:#0D060F;background:#F2AEC6;-webkit-tap-highlight-color:transparent}
.go:active{background:#D894AC}
</style>
<script>location.replace("https://allmyspicylink.com/tunelqavi")</script>
</head>
<body>
<div class="glow" aria-hidden="true"><b></b></div>
<main class="card">
<p>Opening…</p>
<a class="go" href="https://allmyspicylink.com/tunelqavi">Tap if nothing happens</a>
</main>
</body>
</html>
