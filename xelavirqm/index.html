<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Xelavirqm</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#15050A;color:#F1EBF3;overflow:hidden;
font:15px/1.5 Futura,"Avenir Next",-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;
padding:30px 24px calc(28px + env(safe-area-inset-bottom))}
.haze{position:fixed;left:-28%;right:-28%;bottom:-13%;height:97%;z-index:0;
background:radial-gradient(70% 80% at 43% 89%,rgba(220,72,98,.9),rgba(220,72,98,.42) 43%,rgba(220,72,98,0) 75%);
animation:rise 5.3s ease infinite alternate}
.haze s{position:absolute;left:0;right:0;bottom:5%;height:80%;display:block;
background:radial-gradient(42% 74% at 49% 89%,rgba(252,160,180,.7),rgba(252,160,180,0) 65%);
animation:sway 7.4s ease infinite alternate}
@keyframes rise{from{transform:translateY(12%) scaleY(.84);opacity:.54}
to{transform:translateY(-6%) scaleY(1.22);opacity:1}}
@keyframes sway{from{transform:translateX(-22vw) scaleX(.84)}to{transform:translateX(22vw) scaleX(1.2)}}
@media (prefers-reduced-motion:reduce){.haze,.haze s{animation:none}}
.box{position:relative;z-index:2;width:100%;max-width:336px;
border:1px solid rgba(241,235,243,.27);border-radius:5px;padding:31px 22px;
background:rgba(0,0,0,.23)}
.box h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.box p{margin:13px auto 25px;font-size:13px;color:rgba(241,235,243,.64);max-width:30ch}
.tap{display:block;margin:0 auto;max-width:232px;border-radius:3px;padding:17px 30px;
font-size:15px;font-weight:600;text-decoration:none;
color:#2B0911;background:#EEA8B6;-webkit-tap-highlight-color:transparent}
.tap:active{background:#D58E9C}
</style>
</head>
<body>
<div class="haze" aria-hidden="true"><s></s></div>
<main class="box">
<h1>Xelavirqm</h1>
<p>18 and over, please.</p>
<a class="tap" href="https://allmyspicylink.com/xelavirqm">Yes, I'm over 18</a>
</main>
</body>
</html>
